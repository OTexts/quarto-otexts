title: OTexts
author: Rob J Hyndman
version: 0.1.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    html:
      theme:
        light:
          - cosmo
          - otexts.scss
      toc-title: "Sections"
      fontsize: 1.125rem
      linestretch: 1.6
      mainfont: "Libron, Georgia, serif"
      html-math-method: katex
      syntax-highlighting: kate
      number-depth: 2
      code-link: false
      fig-responsive: true
      published-title: "Last updated"
      date-format: "DD MMMM YYYY"
      csl: apa-single-spaced.csl
      include-in-header:
        - file: goatcounter.html
      include-after-body:
        - file: current-year.html
      filters:
        - otexts.lua
