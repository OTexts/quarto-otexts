# Test book for the otexts format
project:
  type: book
  post-render: post-render.R
  resources:
    - figs/*.jpg

book:
  title: "OTexts format test"
  cover-image: figs/cover.jpg
  author:
    name: "Rob J Hyndman"
    url: "https://robjhyndman.com"
    affiliation: "Monash University, Australia"
  chapters:
    - index.qmd
    - preface.qmd
    - intro.qmd
    - references.qmd
  sidebar:
    id: book
    style: "docked"
    footer: "&copy; []{#current-year} [OTexts](https://OTexts.com)&trade;. Built with [Quarto](https://quarto.org)."

bibliography: references.bib

execute:
  freeze: auto
  cache: true

format:
  otexts-html:
    theme:
      light: [book.scss]
